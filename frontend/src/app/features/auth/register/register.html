<div class="acesso tela-cheia">
  <app-logo />
  <form class="cartao form" (ngSubmit)="cadastrar()" #f="ngForm">
    <div class="pilha" style="gap: 6px">
      <h1>Criar conta grátis</h1>
      <p class="suave">1 turma e 2 provas por mês, sem cartão.</p>
    </div>

    @if (erro()) {
      <div class="alerta alerta-erro" role="alert">
        <app-icone nome="erro" />
        <div class="alerta-corpo"><strong>{{ erro() }}</strong></div>
      </div>
    }

    <div class="campo">
      <label for="c-nome">Nome</label>
      <input class="entrada" id="c-nome" type="text" name="nome" autocomplete="name"
        placeholder="Como você quer ser chamada(o)" [(ngModel)]="nome" required [disabled]="carregando()" />
    </div>
    <div class="campo">
      <label for="c-email">E-mail</label>
      <input class="entrada" id="c-email" type="email" name="email" autocomplete="email"
        placeholder="seu@email.com" [(ngModel)]="email" required [disabled]="carregando()" />
    </div>
    <div class="campo" [class.campo-erro]="senhaCurta.invalid && senhaCurta.touched">
      <label for="c-senha">Senha</label>
      <input class="entrada" id="c-senha" type="password" name="senha" autocomplete="new-password"
        [(ngModel)]="senha" #senhaCurta="ngModel" required minlength="8" [disabled]="carregando()"
        aria-describedby="c-senha-ajuda" />
      @if (senhaCurta.invalid && senhaCurta.touched) {
        <span class="msg-erro" id="c-senha-ajuda"><app-icone nome="erro" tamanho="p" />Use pelo menos 8 caracteres.</span>
      } @else {
        <span class="ajuda" id="c-senha-ajuda">Pelo menos 8 caracteres.</span>
      }
    </div>

    <button class="btn btn-primario btn-bloco" type="submit" [disabled]="f.invalid" [attr.aria-busy]="carregando()">
      @if (carregando()) {
        <app-icone nome="girando" />
        Criando conta…
      } @else {
        Criar conta
      }
    </button>
    <p class="suave" style="text-align: center">Já tem conta? <a routerLink="/login">Entrar</a></p>
  </form>
</div>
