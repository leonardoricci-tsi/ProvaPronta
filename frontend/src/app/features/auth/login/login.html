<div class="acesso tela-cheia">
  <app-logo />
  <form class="cartao form" (ngSubmit)="entrar()" #f="ngForm">
    <div class="pilha" style="gap: 6px">
      <h1>Entrar</h1>
      <p class="suave">Que bom te ver de novo.</p>
    </div>

    @if (erro()) {
      <div class="alerta alerta-erro" role="alert">
        <app-icone nome="erro" />
        <div class="alerta-corpo">
          <strong>{{ erro() }}</strong>
          <span>Confira e tente de novo, ou redefina a senha.</span>
        </div>
      </div>
    }

    <div class="campo">
      <label for="l-email">E-mail</label>
      <input class="entrada" id="l-email" type="email" name="email" autocomplete="email"
        placeholder="seu@email.com" [(ngModel)]="email" required [disabled]="carregando()" />
    </div>
    <div class="campo" [class.campo-erro]="erro()">
      <div class="linha" style="justify-content: space-between">
        <label class="rotulo" for="l-senha">Senha</label>
        <a routerLink="/esqueci-senha" style="font-size: .9375rem">Esqueci a senha</a>
      </div>
      <input class="entrada" id="l-senha" type="password" name="senha" autocomplete="current-password"
        [(ngModel)]="senha" required [disabled]="carregando()" [attr.aria-invalid]="erro() ? true : null" />
    </div>

    <button class="btn btn-primario btn-bloco" type="submit" [disabled]="f.invalid" [attr.aria-busy]="carregando()">
      @if (carregando()) {
        <app-icone nome="girando" />
        Entrando…
      } @else {
        Entrar
      }
    </button>
    <p class="suave" style="text-align: center">
      Ainda não tem conta? <a routerLink="/registro">Criar conta grátis</a>
    </p>
  </form>
</div>
